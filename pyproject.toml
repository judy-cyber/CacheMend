[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachemend"
version = "0.1.0"
description = "CacheMend: salient-but-stale KV cache repair for RAG"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "transformers==4.51.0", "numpy>=1.24", "pyarrow>=14", "accelerate>=0.30", "sentencepiece", "protobuf"]

[tool.setuptools.packages.find]
where = ["src"]
